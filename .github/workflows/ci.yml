name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # wird zusaetzlich vom Release-Workflow aufgerufen
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: python -m pip install black==26.10.1 flake8==7.5.0

      - name: Formatierung pruefen (black)
        run: black --check --diff .

      - name: Code-Qualitaet pruefen (flake8)
        run: flake8 .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Abhaengigkeiten installieren
        run: python -m pip install -r requirements-dev.txt

      - name: Tests mit Testabdeckung ausfuehren
        run: >
          python -m pytest
          --cov --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml

      - name: Testabdeckung in der Zusammenfassung anzeigen
        if: always()
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Testberichte als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testberichte
          path: |
            coverage.xml
            test-results.xml
          retention-days: 30
